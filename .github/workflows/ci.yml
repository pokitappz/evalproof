name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: rustup update stable --no-self-update
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 scripts/verify_statistics.py
      - name: Verify paid gates with an offline test issuer
        run: |
          cargo run --locked --example license_fixture -- target/test.lease offline-test
          cargo build --locked --bin evalproof --config 'env.EVALPROOF_LICENSE_PUBLIC_KEY="ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c"' --config 'env.EVALPROOF_LICENSE_ENVIRONMENT="test"'
          python3 scripts/test_paid_ci.py --binary target/debug/evalproof --lease target/test.lease
      - run: python3 -m unittest discover -s packages/python/tests -v
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
        working-directory: packages/node
      - run: npm test
        working-directory: packages/node
      - run: npm audit --omit=optional --audit-level=high
        working-directory: packages/node

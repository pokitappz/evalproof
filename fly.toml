# Entitlement service. Deploy manually with `fly deploy` after setting secrets
# (see docs/release.md). Keep exactly one machine: the upstream rate limiter
# and the activation lock are process-local.
app = "evalproof-entitlements"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDRESS = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

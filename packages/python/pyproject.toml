[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalproof"
version = "0.1.0"
description = "Local evidence-based mutation testing for AI graders"
requires-python = ">=3.11"
license = "Elastic-2.0"

[project.scripts]
evalproof = "evalproof.cli:main"

[tool.setuptools.package-data]
evalproof = ["bin/*"]
